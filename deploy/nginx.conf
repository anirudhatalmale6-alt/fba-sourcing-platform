# Source Reveal - sourcereveal.co.uk
#
# One canonical hostname: https://sourcereveal.co.uk
# Everything else (www, the .com, www.com, and all plain HTTP) redirects to it,
# so link authority and search results never get split across four addresses.
#
# Certificate covers all four names:
#   certbot --nginx -d sourcereveal.co.uk -d www.sourcereveal.co.uk \
#                   -d sourcereveal.com   -d www.sourcereveal.com
#
# NOTE: no default_server anywhere. Other sites already share ports 80/443 on this
# machine and must keep matching on their own server_name.

# --- HTTP: certbot's challenge, then straight to canonical HTTPS ---------------
server {
    listen 80;
    server_name sourcereveal.co.uk www.sourcereveal.co.uk
                sourcereveal.com   www.sourcereveal.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://sourcereveal.co.uk$request_uri; }
}

# --- HTTPS: the canonical host, the only one that serves the app --------------
server {
    listen 443 ssl http2;
    server_name sourcereveal.co.uk;

    ssl_certificate     /etc/letsencrypt/live/sourcereveal.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sourcereveal.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /opt/fba-platform/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- HTTPS: every other spelling of the name folds into the canonical one -----
# These need the certificate too, otherwise a visitor typing https://sourcereveal.com
# gets a browser warning before they ever reach the redirect.
server {
    listen 443 ssl http2;
    server_name www.sourcereveal.co.uk sourcereveal.com www.sourcereveal.com;

    ssl_certificate     /etc/letsencrypt/live/sourcereveal.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sourcereveal.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://sourcereveal.co.uk$request_uri;
}
