# Margin Reveal - marginreveal.co.uk
#
# Install as /etc/nginx/sites-available/marginreveal, symlink into sites-enabled,
# then once DNS resolves to this box:
#
#   certbot --nginx -d marginreveal.co.uk -d www.marginreveal.co.uk \
#                   -d marginreveal.com   -d www.marginreveal.com
#
# certbot adds the 443 blocks and the HTTP->HTTPS redirect itself. This file is
# deliberately port 80 only so nginx starts cleanly before any certificate exists.
#
# NOTE: no default_server anywhere. Other sites already share ports 80/443 on this
# machine and must keep matching on their own server_name.

server {
    listen 80;
    server_name marginreveal.co.uk www.marginreveal.co.uk;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /opt/fba-platform/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The .com is a defensive registration. Send it to the .co.uk so there is one
# canonical address and one set of search results.
server {
    listen 80;
    server_name marginreveal.com www.marginreveal.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://marginreveal.co.uk$request_uri; }
}
