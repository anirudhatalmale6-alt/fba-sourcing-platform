{% extends "admin/_base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login-box">
  <h1>{{ brand }}</h1>
  <p>Admin area</p>
  {% if err %}<div class="formerr">Those details were not recognised.</div>{% endif %}
  <form method="post" action="/admin/login">
    <div class="field"><label>Username</label>
      <input type="text" name="username" required autofocus></div>
    <div class="field"><label>Password</label>
      <input type="password" name="password" required
        style="width:100%;padding:10px 11px;border:1px solid var(--rule-2);font-family:var(--mono)"></div>
    <button class="btn amber wide" type="submit" style="margin-top:8px">Sign in</button>
  </form>
</div>
{% endblock %}
